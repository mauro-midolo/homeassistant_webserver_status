name: Validate with hassfest

on:
  pull_request:
  push:
    branches: [ main ]
  schedule:
    - cron:  "0 12 * * *"

jobs:
  validate:
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v7"
      - uses: "home-assistant/actions/hassfest@50baf3a307f87100cf550d4ae127746595030d5d"
