name: Validate with HACS

on:
  pull_request:
  push:
    branches: [ main ]
  schedule:
    - cron: "0 12 * * *"

jobs:
  hacs:
    name: HACS Action
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v6"
      - name: HACS Action
        uses: "hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa"
        with:
          category: "integration"
          ignore: "brands"
