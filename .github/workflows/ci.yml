name: CI

on:
  pull_request:
  push:
    branches: [ main ]
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

jobs:
  hacs:
    name: HACS validation
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v7"
      - name: HACS Action
        uses: "hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa"
        with:
          category: "integration"
          ignore: "brands"

  hassfest:
    name: Hassfest validation
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v7"
      - uses: "home-assistant/actions/hassfest@cd6f3635a740c84d8a14f6121a90068b8ece6bf6"

  release:
    name: Release
    needs: [ hacs, hassfest ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: "ubuntu-latest"
    permissions:
      contents: write
    concurrency:
      group: release
    env:
      MANIFEST: custom_components/webserver_status/manifest.json
    steps:
      - uses: "actions/checkout@v7"
        with:
          fetch-depth: 0

      - name: Compute next version
        id: version
        run: |
          last_tag=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          last_tag=${last_tag:-v0.0.0}

          # Release only when the integration itself changed since the last release
          if git rev-parse -q --verify "refs/tags/$last_tag" >/dev/null && git diff --quiet "$last_tag" HEAD -- \
              custom_components hacs.json ':(exclude)custom_components/webserver_status/tests'; then
            echo "No integration changes since $last_tag, skipping release"
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          IFS=. read -r major minor patch <<< "${last_tag#v}"
          version="$major.$minor.$((patch + 1))"
          echo "Releasing v$version (previous: $last_tag)"
          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Tag and publish release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # The tagged commit carries the release version in manifest.json
          jq --arg v "$VERSION" '.version = $v' "$MANIFEST" > manifest.tmp
          mv manifest.tmp "$MANIFEST"
          git commit -am "Release v$VERSION"
          git tag "v$VERSION"
          git push origin "v$VERSION"

          gh release create "v$VERSION" --title "v$VERSION" --generate-notes --verify-tag
